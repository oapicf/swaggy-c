---
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: iamsauravsharma/create-dotenv@v4.0.0
        with:
          input-prefix: 'GITHUB_'
          output-prefix: 'GITHUB_'
          file-path: '/tmp/.env'
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make ci'
          image: cliffano/studio:4.0.0
          extra_path: /usr/local/go/bin:/usr/local/maven/bin:/usr/local/node/bin:/usr/local/openjdk-jdk/bin:/root/.cargo/bin:/root/go/bin
          env_file: '/tmp/.env'