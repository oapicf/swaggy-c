name: Publish API Documentation
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.OAPICF_GITHUB_TOKEN }}
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: make deps init-spec doc-latest doc-version
      - run: >-
          CACHE_DIR=/tmp gh-pages --dist doc/ --user "pakkunbot
          <pakkunbot@users.noreply.github.com>" --repo "https://cliffano:${{
          secrets.OAPICF_GITHUB_TOKEN }}@github.com/oapicf/swaggy-c-file-example.git"
