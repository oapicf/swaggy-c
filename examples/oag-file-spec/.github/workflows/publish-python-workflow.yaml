name: Publish Python
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: $
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: cliffano/studio:3.8.0
          shell: bash
          command: |
            make clean deps init-spec generate-primary build-python test-python &&
            make publish-python
